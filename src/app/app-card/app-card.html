@if (cardData) {
  <div class="card app-card border-primary mb-3">
    <div class="card-header text-bg-primary text-center">{{ index }}: {{ cardData.title }}</div>
    <div class="d-flex justify-content-center position-relative">
      @if (cardData.icon) {
        <img class="app-img" alt="Angular Logo" [src]="cardData.icon">
      }
      @else {
        <img class="app-img" alt="Angular Logo" [src]="iconEmpty">
      }
      <div class="ribbon-wrapper ribbon-lg">
        <div class="ribbon" [ngClass]="getRibbonClass()">{{ cardData.category }}</div>
      </div>
    </div>
    <div class="card-body">
      <div class="card-text text-center">{{ cardData.description }}</div>
      <div>
        <button type="button" class="btn btn-primary" (click)="onButtonViewClick()">View lecture</button>
        <button class="btn btn-primary float-end" (click)="onButtonSubmitClick()">Subscribe</button>
      </div>
    </div>
  </div>
}
